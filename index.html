
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agriculture LLC</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
}

/* FIRST SCREEN */
#login {
  background: #000;
  color: #f5f5f7;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  width: 90%;
  max-width: 360px;
  text-align: center;
}

.login-box h1 {
  font-size: 25px;
  font-weight: 500;
}

.subtitle {
  color: #777;
  font-size: 14px;
  margin-bottom: 30px;
}

input {
  width: 100%;
  padding: 14px;
  background: #111;
  border: 1px solid #333;
  border-radius: 9px;
  color: white;
  font-size: 15px;
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: none;
  border-radius: 9px;
  background: #f5f5f7;
  color: #000;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

#error {
  color: #ff5555;
  font-size: 13px;
}

/* SECOND SCREEN */
#protected {
  display: none;
  min-height: 100vh;
  background: white;
  color: black;
  padding: 45px 50px;
}

#protected h1 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 28px;
  font-weight: bold;
  margin: 0;
}
</style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="login">
  <div class="login-box">
    <h1>Private Access</h1>
    <p class="subtitle">Enter your password to continue.</p>

    <form onsubmit="checkPassword(event)">
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Continue</button>
    </form>

    <p id="error"></p>
  </div>
</div>

<!-- PROTECTED SCREEN -->
<div id="protected">
  <h1>Agriculture LLC</h1>
</div>

<script>
function checkPassword(event) {
  event.preventDefault();

  const password = document.getElementById("password").value;

  if (password === "verifybank") {
    document.getElementById("login").style.display = "none";
    document.getElementById("protected").style.display = "block";
  } else {
    document.getElementById("error").textContent =
      "Incorrect password. Please try again.";
  }
}
</script>

</body>
</html>
